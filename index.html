<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Technical Signal Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .app-box {
            background: #151c2c;
            width: 100%;
            max-width: 420px;
            border-radius: 16px;
            padding: 25px;
            border: 1px solid #2a364f;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            font-size: 13px;
            color: #94a3b8;
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }
        select {
            width: 100%;
            padding: 14px;
            background: #0b0f19;
            color: #ffffff;
            border: 1px solid #2a364f;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            cursor: pointer;
        }
        select:focus {
            border-color: #38bdf8;
        }
        .btn-get {
            width: 100%;
            padding: 16px;
            background: #0284c7;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }
        .btn-get:active {
            opacity: 0.8;
            transform: scale(0.98);
        }
        
        .result-box {
            margin-top: 22px;
            padding: 20px;
            background: #0b0f19;
            border-radius: 12px;
            border: 1px solid #2a364f;
            display: none;
        }
        .loading {
            color: #38bdf8;
            font-size: 14px;
            font-weight: 600;
        }
        .signal-text {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: 1px;
        }
        .buy { color: #22c55e; }
        .sell { color: #ef4444; }
        .neutral { color: #eab308; }

        .analysis-detail {
            margin-top: 10px;
            font-size: 12px;
            color: #cbd5e1;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="app-box">
    <div class="form-group">
        <label>রিয়েল-টাইম ফরেক্স পেয়ার</label>
        <select id="pairSelect">
            <option value="EURUSD=X">EUR/USD</option>
            <option value="EURJPY=X">EUR/JPY</option>
            <option value="CADJPY=X">CAD/JPY</option>
            <option value="GBPJPY=X">GBP/JPY</option>
            <option value="GBPAUD=X">GBP/AUD</option>
            <option value="AUDJPY=X">AUD/JPY</option>
            <option value="AUDUSD=X">AUD/USD</option>
            <option value="CHFJPY=X">CHF/JPY</option>
            <option value="EURCHF=X">EUR/CHF</option>
            <option value="AUDCAD=X">AUD/CAD</option>
            <option value="EURCAD=X">EUR/CAD</option>
            <option value="EURAUD=X">EUR/AUD</option>
            <option value="GBPCHF=X">GBP/CHF</option>
        </select>
    </div>

    <button class="btn-get" onclick="fetchLiveSignal()">ANALYZE REAL MARKET</button>

    <div class="result-box" id="resultBox">
        <div id="loading" class="loading">🔄 লাইভ মার্কেট ডাটা ফেচ ও RSI ক্যালকুলেট হচ্ছে...</div>
        <div id="signalResult" style="display: none;">
            <div id="signalVal" class="signal-text buy">BUY</div>
            <div class="analysis-detail" id="analysisDetail"></div>
        </div>
    </div>
</div>

<script>
    async function fetchLiveSignal() {
        const symbol = document.getElementById('pairSelect').value;
        const resultBox = document.getElementById('resultBox');
        const loading = document.getElementById('loading');
        const signalResult = document.getElementById('signalResult');
        const signalVal = document.getElementById('signalVal');
        const analysisDetail = document.getElementById('analysisDetail');

        resultBox.style.display = 'block';
        loading.style.display = 'block';
        signalResult.style.display = 'none';

        try {
            // Yahoo Finance API endpoint for Real-Time Price History
            const url = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1m&range=1d`;
            const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
            const data = await response.json();
            const parsedData = JSON.parse(data.contents);

            const closePrices = parsedData.chart.result[0].indicators.quote[0].close;
            // Clean null values from price array
            const validPrices = closePrices.filter(p => p !== null);

            if (validPrices.length < 15) {
                throw new Error("যথেষ্ট মার্কেট ডাটা পাওয়া যায়নি।");
            }

            // Real Mathematical RSI (14 Period) Calculation Algorithm
            let gains = 0, losses = 0;
            const period = 14;
            const recentPrices = validPrices.slice(-period - 1);

            for (let i = 1; i <= period; i++) {
                let diff = recentPrices[i] - recentPrices[i - 1];
                if (diff >= 0) gains += diff;
                else losses -= diff;
            }

            let avgGain = gains / period;
            let avgLoss = losses / period;
            let rs = avgLoss === 0 ? 100 : avgGain / avgLoss;
            let rsi = 100 - (100 / (1 + rs));

            const lastPrice = validPrices[validPrices.length - 1].toFixed(5);

            loading.style.display = 'none';
            signalResult.style.display = 'block';

            // Technical Analysis Decision Matrix
            if (rsi < 35) {
                signalVal.innerText = "BUY";
                signalVal.className = "signal-text buy";
                analysisDetail.innerHTML = `📊 <b>লাইভ প্রাইস:</b> ${lastPrice}<br>📈 <b>RSI Score:</b> ${rsi.toFixed(2)} (Oversold Area - মার্কেট রিভার্স করে উপরে যাবে)`;
            } else if (rsi > 65) {
                signalVal.innerText = "SELL";
                signalVal.className = "signal-text sell";
                analysisDetail.innerHTML = `📊 <b>লাইভ প্রাইস:</b> ${lastPrice}<br>📉 <b>RSI Score:</b> ${rsi.toFixed(2)} (Overbought Area - মার্কেট রিভার্স করে নিচে নামবে)`;
            } else {
                signalVal.innerText = "NEUTRAL";
                signalVal.className = "signal-text neutral";
                analysisDetail.innerHTML = `📊 <b>লাইভ প্রাইস:</b> ${lastPrice}<br>⚖️ <b>RSI Score:</b> ${rsi.toFixed(2)} (মার্কেট রেঞ্জিং পর্যায়ে আছে, ট্রেড এড়িয়ে চলুন)`;
            }

        } catch (error) {
            loading.style.display = 'none';
            signalResult.style.display = 'block';
            signalVal.innerText = "ERROR";
            signalVal.className = "signal-text neutral";
            analysisDetail.innerText = "লাইভ ডাটা কানেক্ট করতে সমস্যা হয়েছে। ইন্টারনেট চেক করে আবার চেষ্টা করুন।";
        }
    }
</script>

</body>
</html>
