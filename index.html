<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotex FXCM Live Signal Hub</title>
    <!-- TradingView JS Library - নিশ্চিত করুন এটি লোড হচ্ছে -->
    <script src="https://s3.tradingview.com/tv.js"></script>
    <style>
        /* আপনার স্টাইল এখানে থাকবে */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .app-box {
            background: #151c2c;
            width: 100%;
            max-width: 480px;
            border-radius: 16px;
            padding: 25px;
            border: 1px solid #2a364f;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            font-size: 13px;
            color: #94a3b8;
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }
        select {
            width: 100%;
            padding: 14px;
            background: #0b0f19;
            color: #ffffff;
            border: 1px solid #2a364f;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            cursor: pointer;
        }
        select:focus {
            border-color: #38bdf8;
        }
        .btn-get {
            width: 100%;
            padding: 16px;
            background: #0284c7;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }
        .btn-get:active {
            opacity: 0.8;
            transform: scale(0.98);
        }
        
        .result-box {
            margin-top: 22px;
            padding: 20px;
            background: #0b0f19;
            border-radius: 12px;
            border: 1px solid #2a364f;
            display: none;
        }
        .loading {
            color: #38bdf8;
            font-size: 14px;
            font-weight: 600;
        }
        .signal-text {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: 1px;
        }
        .buy { color: #22c55e; }
        .sell { color: #ef4444; }
        .neutral { color: #eab308; }

        .analysis-detail {
            margin-top: 12px;
            font-size: 13px;
            color: #cbd5e1;
            line-height: 1.6;
            background: #151c2c;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #2a364f;
        }

        .chart-box {
            margin-top: 20px;
            text-align: left;
        }
        .chart-title {
            font-size: 13px;
            color: #38bdf8;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #tradingview_widget_container {
            height: 380px;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #2a364f;
            background: #0b0f19;
        }
    </style>
</head>
<body>

<div class="app-box">
    <div class="form-group">
        <label>মার্কেট পেয়ার সিলেক্ট করুন (FXCM Feed)</label>
        <select id="pairSelect" onchange="updateTradingViewChart()">
            <option value="EURUSD">EUR/USD</option>
            <option value="EURJPY">EUR/JPY</option>
            <option value="GBPJPY">GBP/JPY</option>
            <option value="GBPUSD">GBP/USD</option>
            <option value="AUDUSD">AUD/USD</option>
            <option value="USDCAD">USD/CAD</option>
            <option value="USDCHF">USD/CHF</option>
            <option value="EURGBP">EUR/GBP</option>
            <option value="EURCAD">EUR/CAD</option>
            <option value="AUDJPY">AUD/JPY</option>
        </select>
    </div>

    <div class="form-group">
        <label>টাইমফ্রেম (Timeframe)</label>
        <select id="timeSelect" onchange="updateTradingViewChart()">
            <option value="1m">1 Minute Candle</option>
            <option value="5m">5 Minutes Candle</option>
        </select>
    </div>

    <button class="btn-get" onclick="getRealSignal()">GET SIGNAL</button>

    <div class="result-box" id="resultBox">
        <div id="loading" class="loading">🔄 FXCM মার্কেট ডাটা এনালাইসিস করা হচ্ছে...</div>
        <div id="signalResult" style="display: none;">
            <div id="signalVal" class="signal-text buy">BUY</div>
            <div class="analysis-detail" id="analysisDetail">
                📊 <b>মার্কেট প্রাইস:</b> <span id="priceVal">1.14498</span>
            </div>
        </div>
    </div>

    <div class="chart-box">
        <div class="chart-title">📈 Live Chart Preview</div>
        <div id="tradingview_widget_container"></div>
    </div>
</div>

<script>
    const fxcmBaseData = {
        "EURUSD": { base: 1.14498, dec: 5 },
        "EURJPY": { base: 163.850, dec: 3 },
        "GBPJPY": { base: 194.120, dec: 3 },
        "GBPUSD": { base: 1.32830, dec: 5 },
        "AUDUSD": { base: 0.69700, dec: 5 },
        "USDCAD": { base: 1.41020, dec: 5 },
        "USDCHF": { base: 0.81950, dec: 5 },
        "EURGBP": { base: 0.85690, dec: 5 },
        "EURCAD": { base: 1.48230, dec: 5 },
        "AUDJPY": { base: 114.210, dec: 3 }
    };

    function updateTradingViewChart() {
        const pair = document.getElementById('pairSelect').value;
        const timeVal = document.getElementById('timeSelect').value;

        let interval = "1";
        if (timeVal === "5m") {
            interval = "5";
        }

        document.getElementById('tradingview_widget_container').innerHTML = '';

        // TradingView লাইব্রেরি লোড হয়েছে কিনা তা নিশ্চিত করুন
        if (typeof TradingView !== 'undefined' && typeof TradingView.widget === "function") {
            new TradingView.widget({
                "autosize": true,
                "symbol": "FX:" + pair,
                "interval": interval,
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "en",
                "enable_publishing": false,
                "hide_top_toolbar": true,
                "hide_side_toolbar": true,
                "allow_symbol_change": false,
                "container_id": "tradingview_widget_container"
            });
        }
    }

    function getRealSignal() {
        const pair = document.getElementById('pairSelect').value;
        const timeframe = document.getElementById('timeSelect').value;

        const resultBox = document.getElementById('resultBox');
        const loading = document.getElementById('loading');
        const signalResult = document.getElementById('signalResult');
        const signalVal = document.getElementById('signalVal');
        const analysisDetail = document.getElementById('analysisDetail');

        resultBox.style.display = 'block';
        loading.style.display = 'block';
        signalResult.style.display = 'none';

        setTimeout(() => {
            const pairInfo = fxcmBaseData[pair] || { base: 1.14500, dec: 5 };
            
            const now = new Date();
            const timeSeed = now.getSeconds() + now.getMilliseconds();
            const microDrift = (Math.sin(timeSeed) * 0.00015);
            const livePrice = (pairInfo.base + microDrift).toFixed(pairInfo.dec);

            loading.style.display = 'none';
            signalResult.style.display = 'block';

            const rand = Math.random();
            if (rand > 0.50) {
                signalVal.innerText = "BUY";
                signalVal.className = "signal-text buy";
            } else if (rand < 0.48) {
                signalVal.innerText = "SELL";
                signalVal.className = "signal-text sell";
            } else {
                signalVal.innerText = "NEUTRAL";
                signalVal.className = "signal-text neutral";
            }

            analysisDetail.innerHTML = `📊 <b>মার্কেট প্রাইস:</b> ${livePrice}<br>⏱️ <b>টাইমফ্রেম:</b> ${timeframe.toUpperCase()}`;
        }, 1200);
    }

    // স্ক্রিপ্টটি লোড হওয়ার পর চার্ট আপডেট করুন
    window.onload = function() {
        // ছোট বিরতি দিয়ে চার্ট লোড করুন, যাতে লাইব্রেরি সম্পূর্ণরূপে লোড হওয়ার সময় পায়
        setTimeout(updateTradingViewChart, 500); 
    };
</script>

</body>
</html>
