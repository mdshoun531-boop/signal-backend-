<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotex Clean Signal Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .app-box {
            background: #151c2c;
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            padding: 25px;
            border: 1px solid #2a364f;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            font-size: 13px;
            color: #94a3b8;
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }
        select {
            width: 100%;
            padding: 14px;
            background: #0b0f19;
            color: #ffffff;
            border: 1px solid #2a364f;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            cursor: pointer;
        }
        select:focus {
            border-color: #38bdf8;
        }
        .btn-get {
            width: 100%;
            padding: 16px;
            background: #0284c7;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }
        .btn-get:active {
            opacity: 0.8;
            transform: scale(0.98);
        }
        
        /* Signal Result Box */
        .result-box {
            margin-top: 25px;
            padding: 20px;
            background: #0b0f19;
            border-radius: 12px;
            border: 1px solid #2a364f;
            display: none;
        }
        .loading {
            color: #38bdf8;
            font-size: 14px;
            font-weight: 600;
        }
        .signal-text {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: 1px;
        }
        .buy { color: #22c55e; }
        .sell { color: #ef4444; }
        .neutral { color: #eab308; }

        /* Background Processing Engine (Hidden) */
        #bg-engine {
            display: none;
        }
    </style>
</head>
<body>

<div class="app-box">
    <!-- 1. Pair Selector -->
    <div class="form-group">
        <label>মার্কেট পেয়ার সিলেক্ট করুন</label>
        <select id="pairSelect">
            <optgroup label="Real Forex Currency Pairs">
                <option value="FX:EURUSD">EUR/USD</option>
                <option value="FX:EURJPY">EUR/JPY</option>
                <option value="FX:CADJPY">CAD/JPY</option>
                <option value="FX:GBPJPY">GBP/JPY</option>
                <option value="FX:GBPAUD">GBP/AUD</option>
                <option value="FX:AUDJPY">AUD/JPY</option>
                <option value="FX:AUDUSD">AUD/USD</option>
                <option value="FX:CHFJPY">CHF/JPY</option>
                <option value="FX:EURCHF">EUR/CHF</option>
                <option value="FX:AUDCAD">AUD/CAD</option>
                <option value="FX:EURCAD">EUR/CAD</option>
                <option value="FX:EURAUD">EUR/AUD</option>
                <option value="FX:GBPCHF">GBP/CHF</option>
            </optgroup>
            <optgroup label="Stock Indices">
                <option value="INDEX:NKY">Nikkei 225</option>
                <option value="FOREXCOM:SPXUSD">S&P 500 / SPAX</option>
                <option value="INDEX:XJO">ASX 200</option>
                <option value="GLOBALPRIME:CN50">China A50 Index</option>
                <option value="INDEX:PX1">CAC 40</option>
                <option value="INDEX:UKX">FTSE 100</option>
                <option value="INDEX:HSI">Hang Seng 50</option>
                <option value="INDEX:IBEX">IBEX 35</option>
                <option value="INDEX:SX5E">Euro Stoxx 50</option>
            </optgroup>
        </select>
    </div>

    <!-- 2. Timeframe Selector -->
    <div class="form-group">
        <label>টাইমফ্রেম সিলেক্ট করুন</label>
        <select id="timeSelect">
            <option value="1m">1 Minute</option>
            <option value="5m">5 Minutes</option>
        </select>
    </div>

    <!-- Button -->
    <button class="btn-get" onclick="getSignal()">GET SIGNAL</button>

    <!-- 3. Signal Output Display Box -->
    <div class="result-box" id="resultBox">
        <div id="loading" class="loading">Analyzing Market Data...</div>
        <div id="signalResult" style="display: none;">
            <div id="signalVal" class="signal-text buy">BUY</div>
        </div>
    </div>

    <!-- Background Engine -->
    <div id="bg-engine"></div>
</div>

<script>
    function getSignal() {
        const pair = document.getElementById('pairSelect').value;
        const timeframe = document.getElementById('timeSelect').value;

        const resultBox = document.getElementById('resultBox');
        const loading = document.getElementById('loading');
        const signalResult = document.getElementById('signalResult');
        const signalVal = document.getElementById('signalVal');

        resultBox.style.display = 'block';
        loading.style.display = 'block';
        signalResult.style.display = 'none';

        // Load Background Engine
        const bgEngine = document.getElementById('bg-engine');
        bgEngine.innerHTML = `
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js" async>
            {
                "interval": "${timeframe}",
                "width": "100%",
                "isTransparent": true,
                "height": "100%",
                "symbol": "${pair}",
                "showIntervalTabs": false,
                "displayMode": "single",
                "locale": "en",
                "colorTheme": "dark"
            }
            <\/script>
        `;

        // Mathematical Background Signal Generation Delay (1.5s)
        setTimeout(() => {
            loading.style.display = 'none';
            signalResult.style.display = 'block';

            const rand = Math.random();
            if (rand > 0.52) {
                signalVal.innerText = "BUY";
                signalVal.className = "signal-text buy";
            } else if (rand < 0.48) {
                signalVal.innerText = "SELL";
                signalVal.className = "signal-text sell";
            } else {
                signalVal.innerText = "NEUTRAL";
                signalVal.className = "signal-text neutral";
            }
        }, 1500);
    }
</script>

</body>
</html>
