<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotex FXCM Advanced Signal Hub</title>
    <script src="https://s3.tradingview.com/tv.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #0b0f19; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .app-box { background: #151c2c; width: 100%; max-width: 480px; border-radius: 16px; padding: 20px; border: 1px solid #2a364f; text-align: center; }
        .form-group { margin-bottom: 12px; text-align: left; }
        label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 5px; font-weight: 600; }
        select { width: 100%; padding: 12px; background: #0b0f19; color: #fff; border: 1px solid #2a364f; border-radius: 8px; outline: none; }
        .btn-get { width: 100%; padding: 14px; background: #0284c7; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-get:disabled { background: #334155; cursor: not-allowed; }
        .result-box { margin-top: 15px; padding: 15px; background: #0b0f19; border-radius: 10px; border: 1px solid #2a364f; display: none; }
        .signal-text { font-size: 26px; font-weight: 800; }
        .buy { color: #22c55e; }
        .sell { color: #ef4444; }
        .neutral { color: #eab308; }
        
        .countdown-box {
            font-size: 36px;
            font-weight: bold;
            color: #38bdf8;
            margin: 10px 0;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        .analysis-detail { margin-top: 10px; font-size: 12px; color: #cbd5e1; background: #151c2c; padding: 10px; border-radius: 6px; text-align: left; line-height: 1.5; }
        #tradingview_widget_container, #technical_analysis_container { width: 100%; border-radius: 10px; border: 1px solid #2a364f; margin-top: 15px; }
        #tradingview_widget_container { height: 300px; }
    </style>
</head>
<body>

<div class="app-box">
    <div class="form-group">
        <label>মার্কেট পেয়ার সিলেক্ট করুন</label>
        <select id="pairSelect" onchange="updateWidgets()">
            <option value="EURUSD">EUR/USD</option>
            <option value="EURJPY">EUR/JPY</option>
            <option value="GBPJPY">GBP/JPY</option>
            <option value="GBPUSD">GBP/USD</option>
            <option value="AUDUSD">AUD/USD</option>
            <option value="USDCAD">USD/CAD</option>
        </select>
    </div>

    <div class="form-group">
        <label>টাইমফ্রেম (Timeframe)</label>
        <select id="timeSelect" onchange="updateWidgets()">
            <option value="1m">1 Minute Candle</option>
            <option value="5m">5 Minutes Candle</option>
        </select>
    </div>

    <button class="btn-get" id="actionBtn" onclick="startAnalysis()">ANALYZE REAL MARKET (5s)</button>

    <div class="result-box" id="resultBox">
        <div id="loadingArea">
            <div style="color:#94a3b8; font-size: 13px;">🧠 আসল মার্কেট ইন্ডিকেটর স্ক্যান করা হচ্ছে...</div>
            <div id="countdown" class="countdown-box">5</div>
        </div>
        <div id="signalResult" style="display: none;">
            <div id="signalVal" class="signal-text">BUY</div>
            <div class="analysis-detail" id="analysisDetail"></div>
        </div>
    </div>

    <!-- TradingView Chart Widget -->
    <div id="tradingview_widget_container"></div>

    <!-- Real Technical Analysis Widget Container -->
    <div style="margin-top:15px;" id="ta_wrapper">
        <label style="text-align:center; margin-bottom:8px;">REAL-TIME TECHNICAL INDICATORS</label>
        <div id="technical_analysis_container"></div>
    </div>
</div>

<script>
    function updateWidgets() {
        const pair = document.getElementById('pairSelect').value;
        const timeVal = document.getElementById('timeSelect').value;
        let interval = timeVal === "5m" ? "5m" : "1m";
        let chartInterval = timeVal === "5m" ? "5" : "1";

        // Chart Update
        document.getElementById('tradingview_widget_container').innerHTML = '';
        if (typeof TradingView !== 'undefined' && typeof TradingView.widget === "function") {
            new TradingView.widget({
                "autosize": true,
                "symbol": "FX:" + pair,
                "interval": chartInterval,
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "en",
                "enable_publishing": false,
                "hide_top_toolbar": true,
                "container_id": "tradingview_widget_container"
            });
        }

        // Technical Analysis Gauge Widget Update
        const taContainer = document.getElementById('technical_analysis_container');
        taContainer.innerHTML = '';
        const script = document.createElement('script');
        script.type = 'text/javascript';
        script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js';
        script.async = true;
        script.innerHTML = JSON.stringify({
            "interval": interval,
            "width": "100%",
            "isTransparent": false,
            "height": 280,
            "symbol": "FX:" + pair,
            "showIntervalTabs": false,
            "displayMode": "single",
            "locale": "en",
            "colorTheme": "dark"
        });
        taContainer.appendChild(script);
    }

    function startAnalysis() {
        const resultBox = document.getElementById('resultBox');
        const loadingArea = document.getElementById('loadingArea');
        const signalResult = document.getElementById('signalResult');
        const countdownEl = document.getElementById('countdown');
        const actionBtn = document.getElementById('actionBtn');

        resultBox.style.display = 'block';
        loadingArea.style.display = 'block';
        signalResult.style.display = 'none';
        actionBtn.disabled = true;

        let timeLeft = 5;
        countdownEl.innerText = timeLeft;

        const timer = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                countdownEl.innerText = timeLeft;
            } else {
                clearInterval(timer);
                generateFinalSignal();
                actionBtn.disabled = false;
            }
        }, 1000);
    }

    function generateFinalSignal() {
        const pair = document.getElementById('pairSelect').value;
        const timeframe = document.getElementById('timeSelect').value;
        const loadingArea = document.getElementById('loadingArea');
        const signalResult = document.getElementById('signalResult');
        const signalVal = document.getElementById('signalVal');
        const analysisDetail = document.getElementById('analysisDetail');

        // Note to trader regarding Real Technical Analysis Widget below
        loadingArea.style.display = 'none';
        signalResult.style.display = 'block';

        signalVal.innerText = "CHECK TECHNICAL GAUGE BELOW";
        signalVal.className = "signal-text neutral";

        analysisDetail.innerHTML = `
            📌 <b>Pair:</b> ${pair} (${timeframe.toUpperCase()})<br>
            🔍 <b>Analysis Strategy:</b> Real-time Multi-Indicator Aggregations (RSI, Moving Averages, Oscillators).<br>
            💡 <b>Rule:</b> নিচের Technical Gauge-এ <b>"STRONG BUY"</b> দেখলে CALL নিন, <b>"STRONG SELL"</b> দেখলে PUT নিন। <b>"NEUTRAL"</b> থাকলে ট্রেড নেওয়া থেকে বিরত থাকুন।
        `;
    }

    window.onload = function() {
        setTimeout(updateWidgets, 500); 
    };
</script>

</body>
</html>
