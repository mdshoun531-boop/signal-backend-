<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotex FXCM Signal Hub</title>
    <script src="https://s3.tradingview.com/tv.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #0b0f19; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .app-box { background: #151c2c; width: 100%; max-width: 480px; border-radius: 16px; padding: 20px; border: 1px solid #2a364f; text-align: center; }
        .form-group { margin-bottom: 12px; text-align: left; }
        label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 5px; font-weight: 600; }
        select { width: 100%; padding: 12px; background: #0b0f19; color: #fff; border: 1px solid #2a364f; border-radius: 8px; outline: none; }
        .btn-get { width: 100%; padding: 14px; background: #0284c7; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-get:hover { background: #0369a1; }
        
        .section-title { font-size: 13px; font-weight: 700; color: #38bdf8; margin-top: 15px; margin-bottom: 8px; text-align: left; text-transform: uppercase; letter-spacing: 0.5px; }
        #tradingview_widget_container, #ta_gauge_container { width: 100%; border-radius: 10px; border: 1px solid #2a364f; overflow: hidden; }
        #tradingview_widget_container { height: 320px; }
        #ta_gauge_container { height: 380px; background: #0b0f19; }
    </style>
</head>
<body>

<div class="app-box">
    <div class="form-group">
        <label>মার্কেট পেয়ার সিলেক্ট করুন (FXCM Feed)</label>
        <select id="pairSelect" onchange="updateAllWidgets()">
            <option value="EURUSD">EUR/USD</option>
            <option value="EURJPY">EUR/JPY</option>
            <option value="GBPJPY">GBP/JPY</option>
            <option value="GBPUSD">GBP/USD</option>
            <option value="AUDUSD">AUD/USD</option>
            <option value="USDCAD">USD/CAD</option>
        </select>
    </div>

    <div class="form-group">
        <label>টাইমফ্রেম (Timeframe)</label>
        <select id="timeSelect" onchange="updateAllWidgets()">
            <option value="1m">1 Minute Candle</option>
            <option value="5m">5 Minutes Candle</option>
        </select>
    </div>

    <button class="btn-get" onclick="updateAllWidgets()">REFRESH REAL-TIME ANALYSIS</button>

    <div class="section-title">📊 TradingView Real-Time Technical Gauge</div>
    <!-- আসল লাইভ অ্যানালাইসিস গেজ -->
    <div id="ta_gauge_container"></div>

    <div class="section-title" style="margin-top:20px;">📈 Live Chart Preview</div>
    <!-- লাইভ চার্ট উইজেট -->
    <div id="tradingview_widget_container"></div>
</div>

<script>
    function updateAllWidgets() {
        const pair = document.getElementById('pairSelect').value;
        const timeVal = document.getElementById('timeSelect').value;
        
        let chartInterval = timeVal === "5m" ? "5" : "1";
        let gaugeInterval = timeVal === "5m" ? "5m" : "1m";

        // ১. চার্ট আপডেট
        document.getElementById('tradingview_widget_container').innerHTML = '';
        if (typeof TradingView !== 'undefined' && typeof TradingView.widget === "function") {
            new TradingView.widget({
                "autosize": true,
                "symbol": "FX:" + pair,
                "interval": chartInterval,
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "en",
                "enable_publishing": false,
                "hide_top_toolbar": true,
                "container_id": "tradingview_widget_container"
            });
        }

        // ২. আসল লাইভ টেকনিক্যাল এনালাইসিস উইজেট আপডেট
        const gaugeContainer = document.getElementById('ta_gauge_container');
        gaugeContainer.innerHTML = ''; 

        const script = document.createElement('script');
        script.type = 'text/javascript';
        script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js';
        script.async = true;
        script.innerHTML = JSON.stringify({
            "interval": gaugeInterval,
            "width": "100%",
            "isTransparent": false,
            "height": 380,
            "symbol": "FX:" + pair,
            "showIntervalTabs": false,
            "displayMode": "single",
            "locale": "en",
            "colorTheme": "dark"
        });
        gaugeContainer.appendChild(script);
    }

    window.onload = function() {
        setTimeout(updateAllWidgets, 300);
    };
</script>

</body>
</html>
